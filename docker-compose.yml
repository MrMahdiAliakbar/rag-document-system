
services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: rag_django
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      FASTEMBED_CACHE_PATH: /embedding_cache/fastembed
      HF_HOME: /embedding_cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - embedding_cache:/embedding_cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  embedding_cache:
